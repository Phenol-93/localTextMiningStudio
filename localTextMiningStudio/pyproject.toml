[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-text-mining-studio"
version = "0.1.0"
description = "A local desktop workbench for text mining workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "charset-normalizer>=3.0",
    "google-genai>=1.0",
    "jieba>=0.42",
    "jsonschema>=4.0",
    "networkx>=3.0",
    "ollama>=0.5",
    "openai>=1.0",
    "PySide6>=6.7",
    "python-docx>=1.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-p no:pytest-qt --basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["."]
